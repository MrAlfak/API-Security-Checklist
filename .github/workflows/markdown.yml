name: Markdown Validation

on:
  pull_request:
  push:
    branches:
      - main
      - agent/security-checklist-hardening

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
