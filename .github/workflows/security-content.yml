name: Security Content Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-controls-and-guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate machine-readable controls
        run: ruby scripts/validate_controls.rb

      - name: Run security guidance regression checks
        run: python3 scripts/security_content_regression.py
