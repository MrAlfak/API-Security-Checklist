<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">API Security Checklist</title>
  <desc id="desc">Audit-ready API security controls aligned with OWASP, ASVS, OAuth and JWT standards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="60" r="170" fill="#0ea5e9" opacity=".08"/>
  <circle cx="1180" cy="300" r="210" fill="#22c55e" opacity=".06"/>
  <g opacity=".16" stroke="#7dd3fc" fill="none">
    <path d="M0 300 H1280"/><path d="M0 315 H1280"/><path d="M0 330 H1280"/>
    <path d="M1030 0 V360"/><path d="M1060 0 V360"/><path d="M1090 0 V360"/>
  </g>
  <g transform="translate(72 66)">
    <path d="M70 0 132 22v52c0 52-28 92-62 108C36 166 8 126 8 74V22Z" fill="none" stroke="url(#accent)" stroke-width="8" filter="url(#glow)"/>
    <path d="m39 88 19 19 43-49" fill="none" stroke="#a7f3d0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="248" y="112" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1">API Security Checklist</text>
  <text x="250" y="157" fill="#a5b4c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Audit-ready • standards-aligned • machine-readable • bilingual EN/FA</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">
    <rect x="250" y="200" width="218" height="52" rx="13" fill="#0e2539" stroke="#1e5475"/>
    <text x="276" y="233" fill="#7dd3fc">65 security controls</text>
    <rect x="486" y="200" width="240" height="52" rx="13" fill="#0d281e" stroke="#1d5a3a"/>
    <text x="514" y="233" fill="#86efac">OWASP + ASVS 5.0</text>
    <rect x="744" y="200" width="218" height="52" rx="13" fill="#1e2033" stroke="#474b78"/>
    <text x="772" y="233" fill="#c4b5fd">OAuth + JWT BCP</text>
  </g>
  <text x="250" y="302" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">REST • GraphQL • gRPC • WebSocket • Webhooks • Multi-tenant SaaS • DevSecOps</text>
</svg>
