controls:
  - id: WEBHOOK-SIGN-001
    title_en: Verify webhook signatures
    title_fa: اعتبارسنجی امضای Webhook
    severity: critical
    applies_to: [webhook]
    requirement: >-
      Webhook receivers verify the provider-defined cryptographic signature over the exact expected raw/canonical payload using timing-safe comparison where applicable.
    verification:
      - Modify payload bytes after signing and verify rejection.
      - Submit invalid/missing signatures and ambiguous signature headers.
    evidence: [signature tests, provider integration configuration]
    references: [OWASP Webhook Security guidance]

  - id: WEBHOOK-REPLAY-002
    title_en: Webhook replay protection
    title_fa: جلوگیری از Replay وب‌هوک
    severity: high
    applies_to: [webhook]
    requirement: >-
      Signed timestamps/nonces/event identifiers are validated with an explicit replay window and duplicate-event handling according to provider semantics.
    verification:
      - Replay a previously valid event inside and outside the allowed window.
      - Verify duplicate event IDs do not repeat protected business effects.
    evidence: [replay tests, deduplication store/configuration]
    references: [OWASP API Security Top 10 2023 API10]

  - id: WEBHOOK-ROTATE-003
    title_en: Webhook secret rotation
    title_fa: چرخش Secret وب‌هوک
    severity: high
    applies_to: [webhook]
    requirement: >-
      Webhook signing secrets support controlled rotation, overlap during rollout when necessary, and prompt revocation after compromise.
    verification:
      - Exercise old/new secret overlap and post-retirement rejection.
      - Verify secrets are not logged or embedded in source code.
    evidence: [rotation runbook, secret-management configuration]
    references: [OWASP ASVS 5.0.0]

  - id: WEBHOOK-AUTHZ-004
    title_en: Webhook business authorization
    title_fa: مجوزدهی عملیات تجاری Webhook
    severity: critical
    applies_to: [webhook, multi-tenant]
    requirement: >-
      A valid provider signature does not automatically authorize arbitrary tenant/object changes; event identifiers and tenant/resource relationships are validated before applying effects.
    verification:
      - Use a validly signed event referencing an unexpected tenant/object and verify policy enforcement.
      - Verify event type allowlists and state transitions.
    evidence: [event policy tests, tenant/object validation logic]
    references: [OWASP API Security Top 10 2023 API1, OWASP API Security Top 10 2023 API10]

  - id: WEBHOOK-AVAIL-005
    title_en: Webhook bounded processing
    title_fa: پردازش محدود Webhook
    severity: medium
    applies_to: [webhook]
    requirement: >-
      Webhook endpoints bound body size, processing time, retries, queue growth, and downstream fan-out and safely handle duplicate/out-of-order delivery.
    verification:
      - Send oversized/high-rate events and simulate downstream failure.
      - Verify queue/retry policies do not create unbounded resource growth.
    evidence: [queue/retry configuration, load tests]
    references: [OWASP API Security Top 10 2023 API4]
